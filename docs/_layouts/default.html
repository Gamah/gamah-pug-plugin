<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% if page.title %}{{ page.title }} | {% endif %}{{ site.title }}</title>
<meta name="description" content="{{ site.description }}">
<style>
:root {
  --bg: #15181c;
  --panel: #1c2026;
  --line: #2b313a;
  --text: #ccd3da;
  --dim: #8b949e;
  --head: #eceff2;
  --code: #e6c07b;
  --link: #6cb6ff;
}
@media (prefers-color-scheme: light) {
  :root:not([data-theme="dark"]) {
    --bg: #f6f7f8; --panel: #fff; --line: #d8dde3; --text: #23282e;
    --dim: #5c6672; --head: #11151a; --code: #8a5a00; --link: #0b62c4;
  }
}
* { box-sizing: border-box; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font: 16px/1.6 -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
}
main { max-width: 760px; margin: 0 auto; padding: 48px 16px 96px; }
h1, h2, h3 { color: var(--head); line-height: 1.25; }
h1 { font-size: 1.9rem; margin: 0 0 1rem; }
h2 { font-size: 1.25rem; margin: 2.5rem 0 .75rem; padding-bottom: .35rem; border-bottom: 1px solid var(--line); }
h3 { font-size: 1.1rem; margin: 2rem 0 .5rem; }
a { color: var(--link); text-decoration: none; }
a:hover { text-decoration: underline; }
code {
  font: .89em/1.4 ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: 4px;
  padding: .08em .35em;
  color: var(--code);
  white-space: nowrap;
}
table { width: 100%; border-collapse: collapse; margin: 1rem 0; }
td, th { border-top: 1px solid var(--line); padding: .5rem .6rem; text-align: left; vertical-align: top; }
thead { display: none; }
tbody tr:hover { background: var(--panel); }
td:first-child { white-space: nowrap; width: 1%; }
ol, ul { padding-left: 1.3rem; }
li { margin: .4rem 0; }
li::marker { color: var(--dim); }
strong { color: var(--head); }
footer { margin-top: 4rem; color: var(--dim); font-size: .85rem; }
@media (max-width: 560px) {
  main { padding: 28px 14px 64px; }
  td:first-child { white-space: normal; }
}
</style>
</head>
<body>
<main>
{{ content }}
<footer><a href="{{ '/' | relative_url }}">GPP</a> &middot; <a href="https://github.com/Gamah/gamah-pug-plugin">source</a></footer>
</main>
</body>
</html>
