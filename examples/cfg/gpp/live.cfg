// mp_halftime_duration is a *target*: its own help text says "shortened if team intros are active", and
// the floor it is shortened to is mp_min_halftime_duration, 8.5s. mp_team_intro_type defaults to "auto",
// which means "normal if mp_halftime is set" - so with a halftime configured the intros are active and
// the half is nearer nine seconds than fifteen, whatever this line says. An MVP anthem is longer than
// nine seconds, which is how it ends up still playing in the second half: nothing stops it, it simply
// runs out, and the half is shorter than the song.
//
// So the intros are turned off by type as well as by time. mp_team_intro_time 0 further down only sets
// their length; it does not stop them counting as active.
// [SOURCE: cvar help text read off this server's engine, CS2 PatchVersion 1.41.9.2, 2026-10-30. Not a
// documented contract - re-read it after a CS2 update.]
mp_team_intro_type none
// The plugin writes this per round: 1 for the round that ends a half, 0 for every other. Here as the
// go-live default so a 1 left behind by a reload or an abandoned match never survives into a new match.
