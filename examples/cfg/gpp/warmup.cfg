// GPP warmup config, exec'd by the plugin. Copied from MatchZy 0.9.1's own cfg/MatchZy/warmup.cfg,
// which is where this server's settings came from before GPP ran the match itself.
// bot_quota is deliberately absent: count_bots test runs put bots on the server and this file
// used to wipe them seconds later.

mp_autokick 0
mp_autoteambalance 0
mp_buy_anywhere 0
mp_buytime 15
mp_death_drop_gun 0
mp_free_armor 0
mp_ignore_round_win_conditions 0
mp_limitteams 0
mp_respawn_on_death_ct 0
mp_respawn_on_death_t 0
mp_solid_teammates 0
mp_spectators_max 20
mp_maxmoney 16000
mp_startmoney 16000
mp_timelimit 0
sv_alltalk 0
sv_auto_full_alltalk_during_warmup_half_end 0
sv_deadtalk 1
sv_full_alltalk 0
sv_hibernate_when_empty 0
sv_infinite_ammo 0
sv_showimpacts 0
sv_voiceenable 1
tv_relayvoice 1
sv_cheats 0
mp_ct_default_melee weapon_knife
mp_ct_default_secondary weapon_hkp2000
mp_ct_default_primary ""
mp_t_default_melee weapon_knife
mp_t_default_secondary weapon_glock
mp_t_default_primary
mp_maxrounds 24
mp_warmup_start
mp_warmup_pausetimer 1
mp_warmuptime 9999
cash_team_bonus_shorthanded 0

// GOTV, commented out on purpose. Demos need tv_enable 1, and with it on this server's engine took
// tv_record - absolute path, relative path, tv_record_immediate 1, SourceTV reported active - and wrote
// no file and printed no error, by hand over rcon as well as from the plugin. So demos do not work here
// yet and GOTV costs a player slot; it is off until someone works out why. Turn these on (and
// match.demos_enabled in Gpp.json) to try again. tv_delay 0 is here because the map's own gamemode cfgs
// put it back to 105 on every load, which would make GPP hold the map for 130s after every match so the
// broadcast could finish. [SOURCE: measured on this server 2026-10-19]
// tv_enable 1
// tv_delay 0
