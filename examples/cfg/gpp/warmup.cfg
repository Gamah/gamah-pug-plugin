// GPP warmup config, exec'd by the plugin, and the file that holds an idle server in warmup.
//
// There is deliberately no bot_quota line here. A stray bot the engine added still gets swept up, but the
// plugin does it right after this file is exec'd (SweepStrayBots), because the order matters and a cfg
// cannot express it: dropping the quota while bots are on the server makes the engine trim the surplus
// itself, and it counts the GOTV client as a bot - so a bot_quota 0 here kicked SourceTV and killed the
// pug's demo. The plugin kicks by name first, then drops the quota to nothing.
// [SOURCE: measured on this server 2026-11-07]
bot_quota_mode normal
mp_autokick 0
mp_autoteambalance 0
mp_buy_anywhere 0
mp_buytime 15
mp_death_drop_gun 0
mp_free_armor 0
mp_ignore_round_win_conditions 0
mp_limitteams 0
mp_respawn_on_death_ct 0
mp_respawn_on_death_t 0
mp_solid_teammates 0
mp_spectators_max 20
mp_maxmoney 16000
mp_startmoney 16000
mp_timelimit 0
sv_alltalk 0
sv_auto_full_alltalk_during_warmup_half_end 0
sv_deadtalk 1
sv_full_alltalk 0
sv_hibernate_when_empty 0
sv_infinite_ammo 0
sv_showimpacts 0
sv_voiceenable 1
tv_relayvoice 1
sv_cheats 0
mp_ct_default_melee weapon_knife
mp_ct_default_secondary weapon_hkp2000
mp_ct_default_primary ""
mp_t_default_melee weapon_knife
mp_t_default_secondary weapon_glock
mp_t_default_primary
mp_maxrounds 24
// The warmup clock is paused below, and a paused clock does not count a freeze period down. Without
// this, a round restarted in the warmup keeps live.cfg's freeze time forever and nobody can move.
mp_freezetime 0
mp_warmup_start
mp_warmup_pausetimer 1
mp_warmuptime 9999
cash_team_bonus_shorthanded 0

// GOTV. tv_enable 1 belongs in server.cfg, not here: it is read before the map loads, and set live it
// leaves SourceTV listening on port 0, recording nothing until the next level change. It does not cost a
// player slot - SourceTV is not in the server's player count.
//
// tv_delay is asserted back to 0 because the map's own gamemode cfgs put it to 105 on every load, and a
// delayed GOTV holds the map for the broadcast to flush after every match. The recording itself does not
// care: what it needs is to have started at a level load. [SOURCE: measured on this server 2026-11-07]
tv_delay 0
// tv_autorecord is deliberately not set here: it is the plugin's, armed for a pug's map change and
// disarmed again afterwards, so an idle reload records nothing. A 1 left in a cfg would record every map
// the server ever loads, and a 0 in a cfg exec'd during a match risks the recording in progress. See
// docs/match.md.
