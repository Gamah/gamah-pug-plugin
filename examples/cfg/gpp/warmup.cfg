// GPP warmup config, exec'd by the plugin, and the file that holds an idle server in warmup.
// bot_quota 0 is the only thing that sweeps up a stray bot the engine added mid-round. A count_bots test
// run survives it: !pug bots re-asserts the quota every two seconds for as long as a test wants bots.
// bot_quota_mode normal because the map's own cfgs leave it on "competitive", where the engine fills
// teams with bots by itself.

bot_quota 0
bot_quota_mode normal
mp_autokick 0
mp_autoteambalance 0
mp_buy_anywhere 0
mp_buytime 15
mp_death_drop_gun 0
mp_free_armor 0
mp_ignore_round_win_conditions 0
mp_limitteams 0
mp_respawn_on_death_ct 0
mp_respawn_on_death_t 0
mp_solid_teammates 0
mp_spectators_max 20
mp_maxmoney 16000
mp_startmoney 16000
mp_timelimit 0
sv_alltalk 0
sv_auto_full_alltalk_during_warmup_half_end 0
sv_deadtalk 1
sv_full_alltalk 0
sv_hibernate_when_empty 0
sv_infinite_ammo 0
sv_showimpacts 0
sv_voiceenable 1
tv_relayvoice 1
sv_cheats 0
mp_ct_default_melee weapon_knife
mp_ct_default_secondary weapon_hkp2000
mp_ct_default_primary ""
mp_t_default_melee weapon_knife
mp_t_default_secondary weapon_glock
mp_t_default_primary
mp_maxrounds 24
// The warmup clock is paused below, and a paused clock does not count a freeze period down. Without
// this, a round restarted in the warmup keeps live.cfg's freeze time forever and nobody can move.
mp_freezetime 0
mp_warmup_start
mp_warmup_pausetimer 1
mp_warmuptime 9999
cash_team_bonus_shorthanded 0

// GOTV. tv_enable has to be 1 before the map loads - set it in server.cfg, not here - and it costs a
// player slot. tv_delay 0 is asserted here because the map's own gamemode cfgs put it back to 105 on
// every load, and a delayed GOTV master holds one frame: the recorder then captures nothing and the demo
// finalises as a header with "Recording time -0.0". The engine writes the file at tv_stoprecord or at
// the level change, never while recording, so an empty directory mid-match means nothing.
// [SOURCE: measured on this server 2026-11-06]
tv_delay 0
